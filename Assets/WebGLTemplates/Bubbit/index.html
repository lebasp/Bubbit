<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      /* Portrait 9:16 frame that fits any window, letterboxed on the sides or top/bottom */
      #unity-container { position: relative; aspect-ratio: 9 / 16; height: min(100vh, calc(100vw * 16 / 9)); height: min(100dvh, calc(100vw * 16 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: {{{ BACKGROUND_COLOR }}}; outline: none; }
      #unity-loading { position: absolute; left: 15%; right: 15%; top: 50%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
      #unity-progress { width: 0; height: 100%; background: #fff; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading"><div id="unity-progress"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var progress = document.querySelector("#unity-progress");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (p) {
        progress.style.width = (100 * p) + "%";
      }).then(function () {
        document.querySelector("#unity-loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
